<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TNCCOC Youth Gathering Photobooth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <p class="script">TNCCOC Youth Gathering</p>
  <h1>Photo Booth <span aria-hidden="true">📸</span></h1>
  <p class="sub">Strike 4 poses, pick a border, and take your strip home!</p>
</header>

<main class="booth">
  <section class="card camera-card" aria-label="Camera">
    <div class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <div id="countdown" class="countdown" aria-live="assertive"></div>
      <div id="flash" class="flash"></div>
      <div id="camMsg" class="cam-msg">Tap “Start camera” to begin ✨</div>
    </div>

    <div class="thumbs" id="thumbs" aria-label="Your photos"></div>

    <div class="chips" role="group" aria-label="Photo filter" id="filters"></div>

    <div class="actions">
      <button id="camBtn" class="btn ghost">Start camera</button>
      <button id="snapBtn" class="btn primary" disabled>Take 4 photos</button>
      <button id="resetBtn" class="btn ghost" disabled>Start over</button>
    </div>
    <p class="hint">Tap a small photo to retake just that one.</p>
  </section>

  <section class="card strip-card" aria-label="Photo strip">
    <div class="strip-wrap"><canvas id="strip" width="600" height="1900"></canvas></div>

    <p class="label">Choose a border</p>
    <div class="borders" id="borders" role="group" aria-label="Border style"></div>

    <button id="dlBtn" class="btn download" disabled>⬇ Download my strip</button>
  </section>
</main>

<footer>Made with 💛 for TNCCOC Youth</footer>
<script src="script.js"></script>
</body>
</html>
